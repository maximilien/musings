<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="axisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
    <marker id="arrowQuery" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e63946"/>
    </marker>
    <marker id="arrowDoc1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2a9d8f"/>
    </marker>
    <marker id="arrowDoc2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#457b9d"/>
    </marker>
    <marker id="arrowDoc3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e9c46a"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#1a1a2e" text-anchor="middle">Vector Similarity in Embedding Space</text>
  
  <!-- 3D Coordinate System -->
  <g transform="translate(200, 280)">
    <!-- Grid lines for depth -->
    <line x1="0" y1="0" x2="180" y2="90" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="50" y1="0" x2="230" y2="90" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="100" y1="0" x2="280" y2="90" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- X axis (horizontal right) -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="210" y="5" font-family="SF Mono, Monaco, monospace" font-size="12" fill="#4a5568">dim₁</text>
    
    <!-- Y axis (vertical up) -->
    <line x1="0" y1="0" x2="0" y2="-180" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="-10" y="-190" font-family="SF Mono, Monaco, monospace" font-size="12" fill="#4a5568">dim₂</text>
    
    <!-- Z axis (diagonal, depth) -->
    <line x1="0" y1="0" x2="120" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="130" y="70" font-family="SF Mono, Monaco, monospace" font-size="12" fill="#4a5568">dim₃</text>
    
    <!-- Origin point -->
    <circle cx="0" cy="0" r="4" fill="#1a1a2e"/>
    
    <!-- Query Vector (red) - pointing up and right -->
    <line x1="0" y1="0" x2="130" y2="-120" stroke="#e63946" stroke-width="3" marker-end="url(#arrowQuery)" filter="url(#glow)"/>
    <circle cx="130" cy="-120" r="6" fill="#e63946"/>
    <text x="140" y="-125" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#e63946">Query</text>
    <text x="140" y="-108" font-family="Georgia, serif" font-size="11" fill="#e63946" font-style="italic">"password reset"</text>
    
    <!-- Doc 1 Vector (teal) - similar to query, small angle -->
    <line x1="0" y1="0" x2="145" y2="-100" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#arrowDoc1)"/>
    <circle cx="145" cy="-100" r="5" fill="#2a9d8f"/>
    <text x="155" y="-95" font-family="Georgia, serif" font-size="12" font-weight="500" fill="#2a9d8f">Doc A</text>
    <text x="155" y="-80" font-family="Georgia, serif" font-size="10" fill="#2a9d8f" font-style="italic">"forgot login"</text>
    
    <!-- Doc 2 Vector (blue) - moderately similar -->
    <line x1="0" y1="0" x2="90" y2="-140" stroke="#457b9d" stroke-width="2.5" marker-end="url(#arrowDoc2)"/>
    <circle cx="90" cy="-140" r="5" fill="#457b9d"/>
    <text x="60" y="-150" font-family="Georgia, serif" font-size="12" font-weight="500" fill="#457b9d">Doc B</text>
    <text x="35" y="-135" font-family="Georgia, serif" font-size="10" fill="#457b9d" font-style="italic">"account access"</text>
    
    <!-- Doc 3 Vector (gold) - dissimilar, different direction -->
    <line x1="0" y1="0" x2="160" y2="-30" stroke="#e9c46a" stroke-width="2.5" marker-end="url(#arrowDoc3)"/>
    <circle cx="160" cy="-30" r="5" fill="#e9c46a"/>
    <text x="170" y="-35" font-family="Georgia, serif" font-size="12" font-weight="500" fill="#e9c46a">Doc C</text>
    <text x="170" y="-20" font-family="Georgia, serif" font-size="10" fill="#e9c46a" font-style="italic">"pricing info"</text>
    
    <!-- Angle arc between Query and Doc A (small angle = similar) -->
    <path d="M 52 -48 A 70 70 0 0 1 58 -40" stroke="#2a9d8f" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
    <text x="68" y="-55" font-family="SF Mono, Monaco, monospace" font-size="9" fill="#2a9d8f">θ=12°</text>
    
    <!-- Angle arc between Query and Doc C (large angle = dissimilar) -->
    <path d="M 40 -37 A 55 55 0 0 1 50 -9" stroke="#e9c46a" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
    <text x="55" y="-15" font-family="SF Mono, Monaco, monospace" font-size="9" fill="#e9c46a">θ=68°</text>
  </g>
  
  <!-- Explanation Panel -->
  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="270" height="280" rx="8" fill="#f8f9fa" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="20" y="30" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1a1a2e">Cosine Similarity</text>
    
    <text x="20" y="55" font-family="Georgia, serif" font-size="12" fill="#4a5568">Measures angle between vectors:</text>
    
    <!-- Formula -->
    <text x="20" y="85" font-family="SF Mono, Monaco, monospace" font-size="13" fill="#1a1a2e">cos(θ) = A · B / (|A| × |B|)</text>
    
    <line x1="20" y1="100" x2="250" y2="100" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Similarity scale -->
    <text x="20" y="125" font-family="Georgia, serif" font-size="12" font-weight="500" fill="#1a1a2e">Similarity Scale:</text>
    
    <rect x="20" y="135" width="230" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="20" y="135" width="230" height="12" rx="6" fill="url(#simGrad)"/>
    <defs>
      <linearGradient id="simGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#e9c46a"/>
        <stop offset="50%" style="stop-color:#457b9d"/>
        <stop offset="100%" style="stop-color:#2a9d8f"/>
      </linearGradient>
    </defs>
    <text x="20" y="160" font-family="SF Mono, Monaco, monospace" font-size="9" fill="#718096">0 (dissimilar)</text>
    <text x="210" y="160" font-family="SF Mono, Monaco, monospace" font-size="9" fill="#718096">1 (identical)</text>
    
    <line x1="20" y1="175" x2="250" y2="175" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Results -->
    <text x="20" y="200" font-family="Georgia, serif" font-size="12" font-weight="500" fill="#1a1a2e">Search Results:</text>
    
    <circle cx="30" cy="220" r="4" fill="#2a9d8f"/>
    <text x="42" y="224" font-family="Georgia, serif" font-size="11" fill="#4a5568">Doc A: cos(θ) = </text>
    <text x="140" y="224" font-family="SF Mono, Monaco, monospace" font-size="11" font-weight="600" fill="#2a9d8f">0.98</text>
    <text x="170" y="224" font-family="Georgia, serif" font-size="10" fill="#718096">(very similar)</text>
    
    <circle cx="30" cy="244" r="4" fill="#457b9d"/>
    <text x="42" y="248" font-family="Georgia, serif" font-size="11" fill="#4a5568">Doc B: cos(θ) = </text>
    <text x="140" y="248" font-family="SF Mono, Monaco, monospace" font-size="11" font-weight="600" fill="#457b9d">0.87</text>
    <text x="170" y="248" font-family="Georgia, serif" font-size="10" fill="#718096">(similar)</text>
    
    <circle cx="30" cy="268" r="4" fill="#e9c46a"/>
    <text x="42" y="272" font-family="Georgia, serif" font-size="11" fill="#4a5568">Doc C: cos(θ) = </text>
    <text x="140" y="272" font-family="SF Mono, Monaco, monospace" font-size="11" font-weight="600" fill="#e9c46a">0.37</text>
    <text x="170" y="272" font-family="Georgia, serif" font-size="10" fill="#718096">(not relevant)</text>
  </g>
  
  <!-- Footer note -->
  <text x="400" y="470" font-family="Georgia, serif" font-size="11" fill="#718096" text-anchor="middle" font-style="italic">Similar documents cluster together in high-dimensional embedding space.</text>
  <text x="400" y="488" font-family="Georgia, serif" font-size="11" fill="#718096" text-anchor="middle" font-style="italic">Actual embeddings have hundreds or thousands of dimensions.</text>
</svg>
