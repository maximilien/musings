<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">Stack Selection Decision Flowchart</text>

  <!-- Start -->
  <rect x="325" y="56" width="250" height="44" rx="22" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="450" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">New Project — What do you need?</text>

  <!-- Arrow down from start -->
  <line x1="450" y1="100" x2="450" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision 1: AI/ML Heavy? -->
  <polygon points="450,130 570,175 450,220 330,175" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#e67e22">AI/ML heavy?</text>
  <text x="450" y="188" text-anchor="middle" font-size="11" fill="#666">(libraries needed)</text>

  <!-- YES from D1 — goes left -->
  <line x1="330" y1="175" x2="225" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#27ae60">YES</text>

  <!-- Python for ML box -->
  <rect x="50" y="152" width="170" height="46" rx="8" fill="#3498db" filter="url(#shadow)"/>
  <text x="135" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Python for ML layer</text>
  <text x="135" y="188" text-anchor="middle" font-size="11" fill="#dceefb">Go/Rust for infra</text>

  <!-- NO from D1 — goes down -->
  <line x1="450" y1="220" x2="450" y2="256" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="242" font-size="11" font-weight="600" fill="#c0392b">NO</text>

  <!-- Decision 2: High concurrency? -->
  <polygon points="450,258 570,303 450,348 330,303" fill="#fff" stroke="#2980b9" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#2980b9">High concurrency?</text>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#666">(parallel workloads)</text>

  <!-- YES from D2 — goes left -->
  <line x1="330" y1="303" x2="225" y2="303" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#27ae60">YES</text>

  <!-- Go/Rust box -->
  <rect x="50" y="280" width="170" height="46" rx="8" fill="#27ae60" filter="url(#shadow)"/>
  <text x="135" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Go or Rust</text>
  <text x="135" y="316" text-anchor="middle" font-size="11" fill="#d5f5e3">Built for concurrency</text>

  <!-- NO from D2 — goes down -->
  <line x1="450" y1="348" x2="450" y2="384" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="370" font-size="11" font-weight="600" fill="#c0392b">NO</text>

  <!-- Decision 3: Enterprise / Long-lived? -->
  <polygon points="450,386 580,431 450,476 320,431" fill="#fff" stroke="#8e44ad" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="426" text-anchor="middle" font-size="13" font-weight="600" fill="#8e44ad">Enterprise scale?</text>
  <text x="450" y="442" text-anchor="middle" font-size="11" fill="#666">(long-lived, large team)</text>

  <!-- YES from D3 — goes left -->
  <line x1="320" y1="431" x2="225" y2="431" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="423" text-anchor="middle" font-size="11" font-weight="600" fill="#27ae60">YES</text>

  <!-- Java/Kotlin box -->
  <rect x="50" y="408" width="170" height="46" rx="8" fill="#8e44ad" filter="url(#shadow)"/>
  <text x="135" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Java / Kotlin</text>
  <text x="135" y="444" text-anchor="middle" font-size="11" fill="#e8daef">Mature tooling at scale</text>

  <!-- NO from D3 — goes down -->
  <line x1="450" y1="476" x2="450" y2="512" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="498" font-size="11" font-weight="600" fill="#c0392b">NO</text>

  <!-- Decision 4: Full-stack web? -->
  <polygon points="450,514 570,555 450,596 330,555" fill="#fff" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="552" text-anchor="middle" font-size="13" font-weight="600" fill="#e74c3c">Full-stack web?</text>
  <text x="450" y="568" text-anchor="middle" font-size="11" fill="#666">(one language everywhere)</text>

  <!-- YES from D4 — goes left -->
  <line x1="330" y1="555" x2="225" y2="555" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="547" text-anchor="middle" font-size="11" font-weight="600" fill="#27ae60">YES</text>

  <!-- TypeScript box -->
  <rect x="50" y="532" width="170" height="46" rx="8" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="135" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">TypeScript / Node.js</text>
  <text x="135" y="568" text-anchor="middle" font-size="11" fill="#fadbd8">Unified front &amp; back</text>

  <!-- NO from D4 — goes right -->
  <line x1="570" y1="555" x2="660" y2="555" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="612" y="547" font-size="11" font-weight="600" fill="#c0392b">NO</text>

  <!-- Evaluate deeper box -->
  <rect x="665" y="532" width="200" height="46" rx="8" fill="#f39c12" filter="url(#shadow)"/>
  <text x="765" y="549" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Evaluate using the</text>
  <text x="765" y="567" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">framework above ↑</text>

  <!-- Side annotation: Always ask -->
  <rect x="660" y="120" width="210" height="110" rx="10" fill="#f9f9f9" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="765" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Always ask first:</text>
  <text x="765" y="162" text-anchor="middle" font-size="11" fill="#555">What does production look like?</text>
  <text x="765" y="179" text-anchor="middle" font-size="11" fill="#555">Who maintains this in 5 years?</text>
  <text x="765" y="196" text-anchor="middle" font-size="11" fill="#555">Where are the libraries?</text>
  <text x="765" y="213" text-anchor="middle" font-size="11" fill="#555">What's the deployment story?</text>

  <!-- Prototype warning -->
  <rect x="660" y="270" width="210" height="70" rx="10" fill="#fff3cd" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="765" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#856404">⚠ Prototype → Production</text>
  <text x="765" y="310" text-anchor="middle" font-size="11" fill="#856404">Start with the production</text>
  <text x="765" y="326" text-anchor="middle" font-size="11" fill="#856404">stack if possible</text>
</svg>
