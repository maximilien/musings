<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">Stack Selection Decision Flowchart</text>

  <!-- ===== PHASE 1: AGENT-FIRST ===== -->

  <!-- Start -->
  <rect x="355" y="56" width="250" height="44" rx="22" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="480" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">New Project — Start Here</text>

  <!-- Arrow down from start -->
  <line x1="480" y1="100" x2="480" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 1: Describe requirements -->
  <rect x="340" y="130" width="280" height="50" rx="10" fill="#1a6b3c" filter="url(#shadow)"/>
  <text x="480" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Describe your requirements</text>
  <text x="480" y="168" text-anchor="middle" font-size="11" fill="#d5f5e3">performance, scale, team, deployment</text>

  <!-- Arrow down -->
  <line x1="480" y1="180" x2="480" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Ask AI agent -->
  <rect x="340" y="210" width="280" height="50" rx="10" fill="#1a6b3c" filter="url(#shadow)"/>
  <text x="480" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Ask an AI coding agent</text>
  <text x="480" y="248" text-anchor="middle" font-size="11" fill="#d5f5e3">to recommend a stack &amp; justify it</text>

  <!-- Arrow down -->
  <line x1="480" y1="260" x2="480" y2="288" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Does the recommendation make sense? -->
  <polygon points="480,290 620,340 480,390 340,340" fill="#fff" stroke="#1a6b3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="334" text-anchor="middle" font-size="13" font-weight="600" fill="#1a6b3c">Recommendation</text>
  <text x="480" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#1a6b3c">defensible?</text>

  <!-- NO — loop back -->
  <line x1="340" y1="340" x2="260" y2="340" stroke="#555" stroke-width="1.5"/>
  <line x1="260" y1="340" x2="260" y2="235" stroke="#555" stroke-width="1.5"/>
  <line x1="260" y1="235" x2="336" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="295" font-size="11" font-weight="600" fill="#c0392b" text-anchor="end">NO — iterate</text>
  <text x="248" y="308" font-size="11" fill="#666" text-anchor="end">refine requirements</text>

  <!-- YES — down to verification -->
  <line x1="480" y1="390" x2="480" y2="428" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="494" y="414" font-size="11" font-weight="600" fill="#27ae60">YES</text>

  <!-- Phase label: Agent-first -->
  <rect x="700" y="130" width="220" height="90" rx="10" fill="#eafaf1" stroke="#1a6b3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="810" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#1a6b3c">Phase 1: Agent-First</text>
  <text x="810" y="175" text-anchor="middle" font-size="11" fill="#555">Let the agent map your</text>
  <text x="810" y="192" text-anchor="middle" font-size="11" fill="#555">requirements to a stack.</text>
  <text x="810" y="209" text-anchor="middle" font-size="11" fill="#555">Challenge its reasoning.</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="80" y1="420" x2="880" y2="420" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="130" y="416" font-size="11" fill="#999" font-style="italic">Verify the recommendation ↓</text>

  <!-- ===== PHASE 2: VERIFY / EVALUATE ===== -->

  <!-- Decision 1: AI/ML Heavy? -->
  <polygon points="480,430 600,475 480,520 360,475" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="472" text-anchor="middle" font-size="13" font-weight="600" fill="#e67e22">AI/ML heavy?</text>
  <text x="480" y="488" text-anchor="middle" font-size="11" fill="#666">(libraries needed)</text>

  <!-- YES from D1 — goes left -->
  <line x1="360" y1="475" x2="255" y2="475" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="467" text-anchor="middle" font-size="11" font-weight="600" fill="#27ae60">YES</text>

  <!-- Python for ML box -->
  <rect x="65" y="452" width="185" height="46" rx="8" fill="#3498db" filter="url(#shadow)"/>
  <text x="157" y="472" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Python for ML layer</text>
  <text x="157" y="488" text-anchor="middle" font-size="11" fill="#dceefb">Go/Rust for infra</text>

  <!-- NO from D1 — goes down -->
  <line x1="480" y1="520" x2="480" y2="548" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="494" y="538" font-size="11" font-weight="600" fill="#c0392b">NO</text>

  <!-- Decision 2: High concurrency? -->
  <polygon points="480,550 600,595 480,640 360,595" fill="#fff" stroke="#2980b9" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="592" text-anchor="middle" font-size="13" font-weight="600" fill="#2980b9">High concurrency?</text>
  <text x="480" y="608" text-anchor="middle" font-size="11" fill="#666">(parallel workloads)</text>

  <!-- YES from D2 — goes left -->
  <line x1="360" y1="595" x2="255" y2="595" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="587" text-anchor="middle" font-size="11" font-weight="600" fill="#27ae60">YES</text>

  <!-- Go/Rust box -->
  <rect x="65" y="572" width="185" height="46" rx="8" fill="#27ae60" filter="url(#shadow)"/>
  <text x="157" y="592" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Go or Rust</text>
  <text x="157" y="608" text-anchor="middle" font-size="11" fill="#d5f5e3">Built for concurrency</text>

  <!-- NO from D2 — goes down -->
  <line x1="480" y1="640" x2="480" y2="668" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="494" y="658" font-size="11" font-weight="600" fill="#c0392b">NO</text>

  <!-- Decision 3: Enterprise / Long-lived? -->
  <polygon points="480,670 610,715 480,760 350,715" fill="#fff" stroke="#8e44ad" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="710" text-anchor="middle" font-size="13" font-weight="600" fill="#8e44ad">Enterprise scale?</text>
  <text x="480" y="726" text-anchor="middle" font-size="11" fill="#666">(long-lived, large team)</text>

  <!-- YES from D3 — goes left -->
  <line x1="350" y1="715" x2="255" y2="715" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="707" text-anchor="middle" font-size="11" font-weight="600" fill="#27ae60">YES</text>

  <!-- Java/Kotlin box -->
  <rect x="65" y="692" width="185" height="46" rx="8" fill="#8e44ad" filter="url(#shadow)"/>
  <text x="157" y="712" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Java / Kotlin</text>
  <text x="157" y="728" text-anchor="middle" font-size="11" fill="#e8daef">Mature tooling at scale</text>

  <!-- NO from D3 — goes right -->
  <line x1="610" y1="715" x2="700" y2="715" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="652" y="707" font-size="11" font-weight="600" fill="#c0392b">NO</text>

  <!-- TypeScript / Evaluate box -->
  <rect x="705" y="692" width="185" height="46" rx="8" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="797" y="712" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">TypeScript / Node.js</text>
  <text x="797" y="728" text-anchor="middle" font-size="11" fill="#fadbd8">or evaluate deeper ↑</text>

  <!-- Phase label: Verify -->
  <rect x="700" y="440" width="220" height="90" rx="10" fill="#fef9e7" stroke="#f0c040" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="810" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#856404">Phase 2: Verify</text>
  <text x="810" y="485" text-anchor="middle" font-size="11" fill="#555">Use these questions to</text>
  <text x="810" y="502" text-anchor="middle" font-size="11" fill="#555">validate the agent's pick.</text>
  <text x="810" y="519" text-anchor="middle" font-size="11" fill="#555">Push back if it doesn't fit.</text>

  <!-- Prototype warning -->
  <rect x="700" y="570" width="220" height="70" rx="10" fill="#fff3cd" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="592" text-anchor="middle" font-size="12" font-weight="700" fill="#856404">Prototype → Production</text>
  <text x="810" y="610" text-anchor="middle" font-size="11" fill="#856404">Start with the production</text>
  <text x="810" y="626" text-anchor="middle" font-size="11" fill="#856404">stack if possible</text>

  <!-- Bottom note -->
  <text x="480" y="800" text-anchor="middle" font-size="12" fill="#888" font-style="italic">Start with requirements and an AI agent — not with a language.</text>
</svg>
